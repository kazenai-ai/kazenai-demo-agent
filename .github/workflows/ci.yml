name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install from PyPI pins
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run hermetic scenarios and smoke
        env:
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          PYTHONPATH: .
        run: |
          set -euo pipefail
          unset OPENAI_API_KEY ANTHROPIC_API_KEY || true
          python -m pytest scenarios -q
          python examples/02_monitor_fake_provider.py
          python examples/03_monitor_multisink_hosted.py | tee /tmp/hosted-refuse.json || true
          grep -q 'KAZENAI_DEMO_HOSTED' /tmp/hosted-refuse.json
