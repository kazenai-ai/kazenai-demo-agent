name: ci

on:
  push:
    branches: [main, master]
  pull_request:

# Least privilege: CI only reads the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      KAZENAI_TIER_MISMATCH_MULTIPLIER: "1"
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install from PyPI pins
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run offline scenarios and smoke
        env:
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          PYTHONPATH: .
        run: |
          set -euo pipefail
          unset OPENAI_API_KEY ANTHROPIC_API_KEY || true
          python -m pytest scenarios -q
          python examples/02_monitor_fake_provider.py
          python examples/03_monitor_multisink_hosted.py | tee /tmp/hosted-refuse.json || true
          grep -q 'KAZENAI_DEMO_HOSTED' /tmp/hosted-refuse.json

  # Framework examples 14-18 and 20 on KazenAI's pinned framework versions.
  frameworks:
    runs-on: ubuntu-latest
    env:
      KAZENAI_TIER_MISMATCH_MULTIPLIER: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-frameworks.txt
      - name: Framework examples offline (must not skip)
        env:
          PYTHONPATH: .
        run: |
          set -o pipefail
          python -m pytest scenarios/test_framework_examples.py -q -rs -k "not crewai" | tee fw.log
          if grep -q SKIPPED fw.log; then echo "framework examples skipped"; exit 1; fi

  crewai:
    runs-on: ubuntu-latest
    env:
      KAZENAI_TIER_MISMATCH_MULTIPLIER: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-crewai.txt
      - name: CrewAI example offline
        env:
          PYTHONPATH: .
          CREWAI_DISABLE_TELEMETRY: "true"
          OTEL_SDK_DISABLED: "true"
        run: python -m pytest scenarios/test_framework_examples.py -q -rs -k crewai

