name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install hermetic deps (PyPI; vendored fallback)
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [[ -f ./vendor/kazenai-1.0.2-py3-none-any.whl ]]; then
            pip install ./vendor/kazen_event_schema-0.6.1-py3-none-any.whl || true
            pip install ./vendor/kazenai_contracts-0.1.0-py3-none-any.whl || true
            pip install ./vendor/kazenai-1.0.2-py3-none-any.whl
          fi
          pip install -r requirements.txt

      - name: Run scenario tests
        env:
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          PYTHONPATH: .
        run: |
          set -euo pipefail
          unset OPENAI_API_KEY ANTHROPIC_API_KEY || true
          pytest scenarios -q
          python examples/02_monitor_fake_provider.py
          python examples/03_monitor_multisink_hosted.py | tee /tmp/hosted-refuse.json || true
          grep -q 'KAZENAI_DEMO_HOSTED' /tmp/hosted-refuse.json
